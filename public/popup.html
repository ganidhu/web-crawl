<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ganidhuz Design Corpus Exporter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <form id="export-form" class="crawl-form">
          <section class="crawl-section">
            <label class="crawl-field span-2" for="target-url">
              <span class="crawl-label">Target URL</span>
              <span class="crawl-input-wrap icon-input">
                <span class="material-symbols-outlined field-icon">language</span>
                <input
                  id="target-url"
                  name="targetUrl"
                  type="url"
                  placeholder="https://editorial-source.com/article"
                  autocomplete="off"
                />
              </span>
            </label>
          </section>

          <section class="crawl-panel">
            <div class="crawl-panel-head">
              <span class="material-symbols-outlined">analytics</span>
              <h2>Crawl Plan</h2>
            </div>
            <div class="crawl-grid">
              <label class="crawl-field" data-tooltip="Choose how far the crawl should stay scoped. Current origin stays on the site, while specific path stays within the current section.">
                <span class="crawl-label">Crawl scope</span>
                <select name="scope">
                  <option value="origin">Current origin</option>
                  <option value="path">Specific path</option>
                </select>
              </label>
              <label class="crawl-field" data-tooltip="Viewport only captures what is visible in the browser. Full document also stores a larger page capture.">
                <span class="crawl-label">Screenshot mode</span>
                <select name="screenshotMode">
                  <option value="viewport">Viewport only</option>
                  <option value="full">Full document</option>
                </select>
              </label>
              <label class="crawl-field" data-tooltip="How many link levels deep the crawler is allowed to follow from the starting page.">
                <span class="crawl-label">Max depth</span>
                <input type="number" min="0" max="5" name="maxDepth" value="2" />
              </label>
              <label class="crawl-field" data-tooltip="The maximum number of pages to capture before the export stops.">
                <span class="crawl-label">Max pages</span>
                <input type="number" min="1" max="100" name="maxPages" value="12" />
              </label>
              <label class="crawl-field" data-tooltip="Limits how many assets like images, fonts, and files can be collected from each page.">
                <span class="crawl-label">Assets / page</span>
                <input type="number" min="10" max="400" name="maxAssetsPerPage" value="120" />
              </label>
            </div>
          </section>

          <footer class="actions">
            <button type="button" id="cancel-button" class="ghost">Cancel</button>
            <button type="submit" id="start-button">
              <span>Start export</span>
              <span class="material-symbols-outlined">bolt</span>
            </button>
          </footer>

          <div class="form-scroll">
            <section class="crawl-section">
              <h2 class="section-title">Capture Behavior</h2>
              <div class="behavior-grid">
                <label class="behavior-card">
                  <input type="checkbox" name="autoScroll" checked />
                  <span class="behavior-copy">
                    <strong>Auto-scroll lazy content</strong>
                    <small>Trigger images and deferred sections before capture.</small>
                  </span>
                </label>
                <label class="behavior-card">
                  <input type="checkbox" name="captureThirdParty" checked />
                  <span class="behavior-copy">
                    <strong>Best-effort third-party assets</strong>
                    <small>Attempt fonts, media, and CDN files when the browser allows it.</small>
                  </span>
                </label>
              </div>
            </section>

            <button type="button" id="status-button" class="status-link">Open live dashboard</button>
          </div>
        </form>
      </section>

      <section class="run-status">
        <div class="status-head">
          <p class="crawl-label">Current run</p>
          <div id="status-line" class="status-line">Idle.</div>
        </div>
        <div class="progress-wrap">
          <progress id="progress" max="1" value="0"></progress>
        </div>
        <pre id="summary"></pre>
      </section>

      <footer class="footer-credit">Built by Ganidhu x Baymax</footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
